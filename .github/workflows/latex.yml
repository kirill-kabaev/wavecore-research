
name: Build LaTeX Papers

on:
  push:
    branches: [main]
    paths:
      - "papers/**"
      - ".github/workflows/latex.yml"

  pull_request:
    paths:
      - "papers/**"
      - ".github/workflows/latex.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-paper:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            biber \
            texlive-luatex \
            texlive-latex-extra \
            texlive-lang-cyrillic \
            texlive-fonts-recommended \
            texlive-science \
            fonts-cmu

      - name: Build scientific paper
        working-directory: papers/01_maxwell_helmholtz
        run: |
          latexmk -lualatex \
            -interaction=nonstopmode \
            -halt-on-error \
            main.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: maxwell-helmholtz-review
          path: papers/01_maxwell_helmholtz/main.pdf
          retention-days: 90
          if-no-files-found: error
