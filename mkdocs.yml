
site_name: WaveCore Research
site_description: Исследования электромагнитных волн и численных методов
site_author: WaveCore Research

docs_dir: docs
site_dir: site

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Главная: index.md
  - Публикации: publications.md
  - О проекте: about.md
