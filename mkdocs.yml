
site_name: WaveCore Research
site_description: Исследования электромагнитных волн и численных методов
site_author: WaveCore Research

docs_dir: docs
site_dir: site

# MkDocs excludes /templates/ by default; this project publishes the
# numerical experiment template as a documentation page.
exclude_docs: |
  !/templates/

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Главная: index.md
  - Публикации: publications.md
  - C++ API: cpp-api.md
  - Test Coverage: test-coverage.md
  - Research Log: research-log.md
  - Numerical Experiment Template: templates/numerical-experiment.md
  - Developer Commands: developer-commands.md
  - Research Roadmap: research-roadmap.md
  - Technical Decisions: technical-decisions.md
  - О проекте: about.md
